# Prometheus 抓取配置。
#
# 这个文件此前缺失，compose 里却挂载着它，导致 `docker compose up`（不带服务名）
# 必定失败——只能逐个点名启动。补齐后整栈可以一条命令起来。
#
# 目标名用 compose 的服务名，Prometheus 与各服务在同一张 compose 网络里，能直接解析。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # agent-service 在独立端口上暴露 /metrics（utils/metrics.py: start_metrics_server）。
  # 与 gRPC 的 50051 分开，避免把指标端点和业务端口混在一起。
  - job_name: agent-grpc
    static_configs:
      - targets: ["agent-grpc:8001"]

  # Go 网关的 /metrics（main.go 里挂的 promhttp）。它提供 WebSocket 连接数，
  # agent 进程看不到这个值。
  - job_name: websocket-server
    static_configs:
      - targets: ["websocket-server:8000"]
